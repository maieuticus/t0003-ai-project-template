name: Branch-Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Branches lesend prüfen
        run: python scripts/branch_audit.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
